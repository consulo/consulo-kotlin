name: Sync upstream plugins/kotlin

# Keeps the upstream-sync branch equal to `git subtree split` of plugins/kotlin
# from intellij-community master, with full history. The split is
# deterministic, so each run only fast-forwards the branch and it can be
# merged into master from time to time.

on:
  schedule:
    - cron: '0 4 * * *'        # daily 04:00 UTC
  workflow_dispatch: {}         # manual trigger too

concurrency:
  group: sync-upstream
  cancel-in-progress: false     # don't abort in-flight sync

permissions:
  contents: write               # needed to push upstream-sync branch

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      UPSTREAM_URL: https://github.com/JetBrains/intellij-community.git
      UPSTREAM_BRANCH: master
      SUBPATH: plugins/kotlin
      SYNC_BRANCH: upstream-sync

    steps:
      - name: Clone upstream
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP"
          # Full history of one branch: the split walks every commit and the
          # push needs every blob (a partial clone breaks the push).
          # No checkout: the split reads commits only, which saves GBs of disk.
          git clone --single-branch --branch "$UPSTREAM_BRANCH" --no-tags --no-checkout \
              "$UPSTREAM_URL" "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" commit-graph write --reachable
          df -h "$RUNNER_TEMP"

      - name: Split
        id: split
        working-directory: ${{ runner.temp }}/upstream
        run: |
          set -euo pipefail
          # Older git-subtree checks the prefix against the working tree.
          mkdir -p "$SUBPATH"
          # Progress is printed with \r, so the log would show it as one huge
          # line; keep every 20000th progress line and all other messages.
          head=$(git subtree split --prefix="$SUBPATH" "origin/$UPSTREAM_BRANCH" \
              2> >(tr '\r' '\n' | awk '!/^[0-9]+\/[0-9]+ / || NR % 20000 == 0 { print; fflush() }' >&2))
          echo "Split head: $head"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Push
        working-directory: ${{ runner.temp }}/upstream
        env:
          NEW_HEAD: ${{ steps.split.outputs.head }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          origin="https://github.com/${GITHUB_REPOSITORY}.git"
          old=$(git ls-remote "$origin" "refs/heads/$SYNC_BRANCH" | cut -f1)

          if [ "$old" = "$NEW_HEAD" ]; then
              echo "$SYNC_BRANCH is up to date at $old" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
          fi

          # Same upstream commits give the same split commits, so the published
          # branch must be an ancestor of the new head. If it is not, the split
          # changed (e.g. a git-subtree update) and pushing would break merges.
          if [ -n "$old" ] && ! git merge-base --is-ancestor "$old" "$NEW_HEAD" 2>/dev/null; then
              echo "::error::$SYNC_BRANCH ($old) is not an ancestor of the new split $NEW_HEAD, refusing to push"
              exit 1
          fi

          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "$NEW_HEAD:refs/heads/$SYNC_BRANCH"

          {
              echo "### $SYNC_BRANCH: \`${old:0:12}\` → \`${NEW_HEAD:0:12}\`"
              if [ -n "$old" ]; then
                  echo "$(git rev-list --count "$old..$NEW_HEAD") new commits"
                  echo '```'
                  git log --oneline --no-decorate -50 "$old..$NEW_HEAD"
                  echo '```'
              fi
          } >> "$GITHUB_STEP_SUMMARY"

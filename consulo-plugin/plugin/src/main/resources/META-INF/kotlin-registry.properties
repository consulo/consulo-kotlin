# Defaults of the upstream registry keys, written by consulo-plugin/tools/genservices.py
kotlin.analysis.allowRestrictedAnalysis=true
kotlin.analysis.enableLocalLookupOptimization=false
kotlin.analysis.modulePackageNamesProvider.enableLibraryPackageNames=true
kotlin.analysis.treeChangePreprocessor.fileProcessingLimit=5
kotlin.auto.completion.dumb.mode.use.psi.completion=true
kotlin.auto.completion.insert.constructor.parenthesis=false
kotlin.auto.completion.prefer.vararg.to.noargs=true
kotlin.cache.packages.strong.map=true
kotlin.caches.fine.grained.entity.validation=true
kotlin.caches.fine.grained.throttling.timeout.ms=5000
kotlin.disable.auto.completion.inside.expression=false
kotlin.formatter.allowTrailingCommaOnCallSite=false
kotlin.highlight.stdlib.dsl.exit.points=false
kotlin.highlighting.internal.show.diagnostic.names=true
kotlin.highlighting.warmup=true
kotlin.indices.diagnostic.enabled=false
kotlin.indices.keys.threshold.size=100000
kotlin.indices.timing.threshold.batch=5000
kotlin.indices.timing.threshold.single=2500
kotlin.java.completion.companion.members=true
kotlin.java.completion.extensions=true
kotlin.k2.chain.completion.enabled=true
kotlin.k2.complete.top.level.packages=true
kotlin.k2.dot.add.enabled=true
kotlin.k2.parallel.completion.enabled=true
kotlin.k2.smart.completion.enabled=true
kotlin.shorten.context.sensitive.resolution.qualifiers.by.default=true
